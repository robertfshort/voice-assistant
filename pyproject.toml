[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "voice-assistant"
version = "0.1.0"
description = "Portable tabletop RPG narration and conversational NPC desktop application"
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
dependencies = [
    "PySide6-Essentials>=6.7,<7",
    "keyring>=25,<26",
    "platformdirs>=4,<5",
    "pydantic>=2.9,<3",
    "PyYAML>=6,<7",
    "qasync>=0.27,<1",
    "roomkit[local-audio,realtime-gemini]>=0.47",
]

[dependency-groups]
dev = [
    "bandit>=1.7,<2",
    "mypy>=1.11,<2",
    "pytest>=8,<10",
    "pytest-qt>=4.4,<5",
    "ruff>=0.6,<1",
]

[project.scripts]
voice-assistant = "voice_assistant.app:main"

[tool.hatch.build.targets.wheel]
packages = ["src/voice_assistant"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py312"
line-length = 99
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
strict = true

[[tool.mypy.overrides]]
module = ["PySide6.*", "qasync", "yaml"]
ignore_missing_imports = true

[tool.bandit]
exclude_dirs = ["tests"]
skips = ["B101"]
